# ClipForge configuration — copy to config/config.toml and edit.
# Every key shown here is every key that exists; unknown keys are REJECTED
# at startup (fail-fast), so typos surface immediately.
#
# Secrets do NOT live here. Set environment variables (or a .env file):
#   CLIPFORGE_HF_TOKEN = hf_...   # gated pyannote models (doctor explains)

[workspace]
# All pipeline state lives under this root: chunks/ artifacts/ clips/ logs/ tmp/
root = "workspace"

[ingest]
poll_interval_s = 60.0        # per-channel live/VOD poll cadence
segment_time_s = 900          # live chunk length (15 min, spec §S0)
playlist_end = 5              # how many recent VODs yt-dlp inspects per poll
overlap_s = 60                # T1: trailing overlap carried into the next chunk
segment_ready_stable_s = 20.0 # size-unchanged window => segment is closed
backoff_base_s = 5.0          # reconnect backoff: base * 2^n + jitter
backoff_max_s = 300.0
twitch_disable_ads = true     # streamlink --twitch-disable-ads
kick_enabled = false          # T4: Kick is best-effort; off unless you opt in
quality = "best"              # streamlink stream selector
youtube_vods = true           # also clip a channel's published VODs

[disk]
free_floor_gb = 50.0          # below this free space, ingestion PAUSES
retention_hours = 48.0        # processed chunks older than this are deleted

[s1]                          # transcription — WhisperX + pyannote
model = "large-v2"
batch_size = 8                # HARD CAP (VRAM protection) — do not raise
compute_type = "float16"
# language = "en"             # unset = autodetect; pin for full determinism
vram_budget_gb = 8.0

[s2]                          # candidate prefilter — CPU heuristics
window_min_s = 30.0
window_max_s = 60.0
top_k = 10
nms_iou = 0.4

[s3]                          # semantic ranking — Qwen2.5-VL-7B INT4
# Spec §2: "Cloud: None. No hosted inference." Written out rather than
# left to the code default, because a fresh install inheriting a silent
# default is how this setting was on for a day without being decided.
# true would send candidate frames and transcript text to Google.
use_cloud = false
model_id = "Qwen/Qwen2.5-VL-7B-Instruct-AWQ"
fallback_model_id = "Qwen/Qwen2.5-VL-7B-Instruct"   # NF4 via bitsandbytes
frames_per_candidate = 8      # strictly 6-8 (spec §S3)
max_pixels = 451584           # T7: per-frame pixel cap (~768x588); OOM guard
seed = 1234
vram_budget_gb = 10.0

[s4]                          # tracking + active speaker + virtual camera
pose_model = "yolo11m-pose.pt"
asd_confidence_tau = 0.5      # below τ: documented fallback framing
deadzone_frac = 0.02          # ignore target drift under 2% of frame width
max_pan_px_per_frame = 40.0
one_euro_min_cutoff = 1.0
one_euro_beta = 0.007
vram_budget_gb = 3.0

[s5]                          # karaoke subtitles (.ass)
font = "Arial Black"
font_size = 72
highlight_color = "&H0000FFFF"  # ASS BGR: yellow active word
base_color = "&H00FFFFFF"       # white
outline = 3.0
shadow = 1.0
margin_v = 260                # keeps text inside the 9:16 safe area
max_words_per_line = 4
max_lines = 2

[s6]                          # final render
width = 1080
height = 1920
encoder = "h264_nvenc"        # falls back to libx264 automatically
nvenc_preset = "p5"
cq = 21
audio_bitrate = "192k"
loudness_i = -14.0            # integrated loudness target (LUFS)
loudness_tp = -1.5
loudness_lra = 11.0

[editor]
style_profile = "viral_fast"
max_hashtags = 5

[posting]
# DRAFT-ONLY, human-gated (see the 2026-07-27 amendment in VERIFICATION.md).
# The automation prepares an upload and stops; you press Publish yourself.
enabled_platforms = ["youtube", "tiktok", "instagram", "x_twitter"]
publish_mode = "draft"            # the ONLY accepted value ("public" is rejected)
smart_scheduling = false          # must stay false: no unattended scheduled posting
require_approval = true           # must stay true: each clip is approved individually
target_timezone_offset_hours = -5.0 # target audience timezone (e.g. -5.0 for EST)
headless = true

[orchestration]
ingest_concurrency = 4
gpu_concurrency = 1           # LAW — exactly one GPU stage at a time
queue_maxsize = 32            # bounded queues => backpressure, not OOM


[watch]
# Recording a live stream is never delayed - it cannot be replayed. The GPU
# clipping behind it waits until nobody is using the machine.
clip_only_when_idle = true
idle_after_s = 300            # no keyboard/mouse input for this long = idle
gpu_busy_pct = 40             # another program using this much GPU = busy
idle_poll_s = 30
preempt_within_s = 60         # input this recent pauses a running job
min_free_vram_gb = 8          # VRAM held by another program = not idle

[notify]
# Send every clip that passes QA to the operator's own Telegram chat. Private
# delivery, not publishing. Token/chat id come from .env
# (CLIPFORGE_TELEGRAM_BOT_TOKEN / CLIPFORGE_TELEGRAM_CHAT_ID) or are read
# from the OpenClaw gateway config below.
telegram = false
openclaw_config = "~/.openclaw/openclaw.json"
retry_interval_s = 600
